name: Build MYRAA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project files
        run: |
          echo "Repository files:"
          find . -maxdepth 4 -type f | head -200
          echo "Gradle settings files:"
          find . -type f \( -name settings.gradle -o -name settings.gradle.kts \)

      - name: Build APK
        run: |
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            gradle assembleDebug
          elif [ -f MYRAA-Android-Project/settings.gradle ] || [ -f MYRAA-Android-Project/settings.gradle.kts ]; then
            cd MYRAA-Android-Project
            gradle assembleDebug
          else
            echo "ERROR: Android Gradle project nahi mila."
            echo "ZIP ke andar project hai to pehle uska exact folder path pata karo."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRAA-Android-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
